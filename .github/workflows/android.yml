name: Compilar APK de Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ClipCaptions.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClipCaptions-apk
          path: ClipCaptions.apk

      - name: Publicar en Releases (descarga directa desde el telefono)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ClipCaptions.apk \
            --title "ClipCaptions para Android" \
            --notes "Descarga **ClipCaptions.apk**, abrelo en tu telefono e instalalo (permite instalar apps de este origen si Android lo pide). Commit: ${GITHUB_SHA::7}"
