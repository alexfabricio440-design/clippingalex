plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clippingalex.clipcaptions'
    compileSdk 34

    defaultConfig {
        applicationId 'com.clippingalex.clipcaptions'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // APK instalable directo (clave de depuracion)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
