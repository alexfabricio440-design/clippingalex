plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clippingalex.clipcaptions'
    compileSdk 35

    defaultConfig {
        applicationId 'com.clippingalex.clipcaptions'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // APK instalable directo (clave de depuracion)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        // las fuentes (Inter y Poppins) viven en /assets del repo y se empaquetan en la app
        main.assets.srcDirs += ['../../assets']
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging {
        resources.excludes += ['META-INF/{AL2.0,LGPL2.1}']
    }
}

dependencies {
    def media3 = '1.8.0'
    implementation "androidx.media3:media3-transformer:$media3"
    implementation "androidx.media3:media3-effect:$media3"
    implementation "androidx.media3:media3-common:$media3"
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.guava:guava:33.2.1-android'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
