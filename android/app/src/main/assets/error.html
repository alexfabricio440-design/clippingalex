<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b14;color:#f4f4fb;font:16px/1.45 system-ui,sans-serif;padding:26px;text-align:center}
h1{font-size:22px;margin:60px 0 8px}p{color:#9a9ab5}
button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;font-size:17px;font-weight:800}
.go{background:linear-gradient(135deg,#b6ff00,#00e5ff);color:#0b0b14}.ghost{background:#1f1f31;color:#fff;border:1px solid #26263a}
</style></head><body>
<h1>No se pudo conectar al servidor</h1>
<p>Revisa que tu servidor esté encendido y que el teléfono tenga internet (o esté en la misma Wi-Fi).</p>
<button class="go" onclick="AndroidBridge.retry()">Reintentar</button>
<button class="ghost" onclick="AndroidBridge.changeServer()">Cambiar servidor</button>
</body></html>
